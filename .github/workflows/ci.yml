name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check --no-cache src tests
      - name: Test
        run: pytest -q -m "not extended_research and not unreleased_standard"

  package:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install ".[dev]"
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install wheel without dependencies
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed release identity
        run: >-
          python -c "import loraphymac;
          assert loraphymac.__version__ == '1.0.0';
          assert loraphymac.SIMULATOR_VERSION == '1.0.0'"
